name: .NET CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore MediTrack.sln

      - name: Build solution
        run: dotnet build MediTrack.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test MediTrack.sln --configuration Release --no-build --verbosity normal
